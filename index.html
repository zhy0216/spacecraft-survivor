<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 中性占位:JS 起来后由 main.ts 按当前语言改写(见 applyDocumentLocale) -->
    <title>STARWRECK</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>"
    />
    <style>
      :root {
        --sw-mobile-control-height: 0px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: #05070d;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      /* 双层结构:canvas 画世界,DOM 画界面(三选一卡片/结算/调参都走 DOM) */
      #game {
        position: fixed;
        inset: 0 0 var(--sw-mobile-control-height) 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none; /* 层本身透传,子元素各自接管 */
        isolation: isolate;
      }
      #ui > * {
        pointer-events: auto;
      }
      /* 载入占位条:内联在 html 里,JS 包还在路上时就能看到。真实进度由 main.ts 通过
         window.__bootLoading 顶上来(见 main.ts 的 bootLoading),这里只负责"慢慢爬 + 平滑顶满" */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #05070d;
        transition: opacity 0.5s ease;
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-title {
        color: #9adcff;
        font: 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.3em;
      }
      #boot-track {
        width: min(60vw, 280px);
        height: 2px;
        background: #1b2a3f;
        border-radius: 1px;
        overflow: hidden;
      }
      #boot-fill {
        height: 100%;
        width: 0%;
        background: #9adcff;
        box-shadow: 0 0 8px #9adcff;
        border-radius: 1px;
      }

      /* 移动端共用布局基线。各 UI 模块仍保留自己的桌面端行内样式，
         这里只通过 class 在窄屏覆写尺寸，避免把响应式逻辑散落到每个组件。 */
      .sw-overlay {
        box-sizing: border-box;
        padding: max(10px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(10px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
      }
      .sw-modal {
        box-sizing: border-box;
        min-width: 0;
      }
      .sw-overlay button,
      .sw-overlay [role='button'] {
        touch-action: manipulation;
      }

      /* 触控驾驶层默认不参与桌面布局；窄屏或粗指针设备进入战斗后才由 JS 点亮。 */
      .sw-mobile-controls {
        display: none;
      }
      .sw-hud-top.sw-hud-stats-hidden {
        display: none !important;
      }

      @media (max-width: 900px), (hover: none) and (pointer: coarse) {
        .sw-modal {
          width: min(100%, 460px) !important;
          max-width: 100% !important;
          max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px) !important;
          overflow-y: auto;
          overscroll-behavior: contain;
          padding: 18px 16px 14px !important;
        }

        .sw-title-card {
          width: min(100%, 420px) !important;
          padding: 24px 18px 18px !important;
        }
        .sw-title-card .sw-title-brand {
          font-size: clamp(24px, 9vw, 30px) !important;
          letter-spacing: .2em !important;
        }

        .sw-overlay button {
          min-height: 44px;
        }

        .sw-settings-row {
          gap: 10px !important;
          align-items: flex-start !important;
        }
        .sw-settings-label {
          min-width: 0;
          flex: 1 1 auto;
          line-height: 1.45;
          overflow-wrap: anywhere;
        }
        .sw-settings-control {
          flex: 0 0 auto;
        }

        .sw-pause-card {
          width: min(100%, 360px) !important;
          padding: 20px 16px 14px !important;
        }
        .sw-pause-keys {
          text-align: left;
          line-height: 1.6;
        }
        .sw-pause-key {
          display: inline-block;
          width: auto !important;
          min-width: 56px;
          margin-right: 8px !important;
          text-align: left !important;
        }
        .sw-pause-key-desc {
          max-width: calc(100% - 74px);
          vertical-align: top;
        }

        .sw-game-over-card {
          width: min(100%, 420px) !important;
          max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px) !important;
          overflow-y: auto;
          padding: 20px 16px 14px !important;
        }
        .sw-game-over-stat-row {
          gap: 10px !important;
        }
        .sw-game-over-stat-row > :first-child {
          min-width: 0;
          overflow-wrap: anywhere;
        }
        .sw-game-over-unlock {
          white-space: pre-wrap !important;
          overflow-wrap: anywhere;
        }

        .sw-codex-card {
          width: min(100%, 640px) !important;
          max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px) !important;
          padding: 16px 14px 12px !important;
        }
        .sw-codex-filters {
          flex-wrap: wrap;
        }
        .sw-codex-filter {
          min-height: 38px !important;
          flex: 1 1 auto;
        }
        .sw-codex-grid {
          grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)) !important;
          gap: 6px !important;
        }
        .sw-codex-weapon-name {
          width: 78px !important;
          flex-basis: 78px !important;
          font-size: 12px !important;
        }
        .sw-codex-weapon-art {
          gap: 6px !important;
        }

        .sw-armory-overlay {
          align-items: flex-start !important;
          justify-content: center !important;
          overflow-y: auto !important;
        }
        .sw-ship-board {
          width: min(100%, 460px) !important;
          padding: 14px 12px 12px !important;
          gap: 8px !important;
        }
        .sw-ship-head {
          gap: 8px !important;
        }
        .sw-ship-ring {
          transform: scale(.72) !important;
          transform-origin: center center;
          margin: -64px 0 !important;
        }
        .sw-ship-hint {
          max-width: 34ch;
          line-height: 1.45;
        }

        .sw-victory-story {
          left: max(18px, env(safe-area-inset-left)) !important;
          right: max(18px, env(safe-area-inset-right)) !important;
          bottom: max(26px, env(safe-area-inset-bottom)) !important;
          width: auto !important;
        }
        .sw-victory-title {
          font-size: clamp(30px, 11vw, 52px) !important;
        }
        .sw-victory-body {
          max-width: 42ch;
          line-height: 1.65 !important;
        }

        .sw-hud-top {
          left: max(10px, env(safe-area-inset-left)) !important;
          right: max(10px, env(safe-area-inset-right)) !important;
          top: max(10px, env(safe-area-inset-top)) !important;
          display: grid !important;
          grid-template-columns: minmax(0, 1fr) auto !important;
          grid-template-areas: 'left timer' 'segment segment';
          gap: 4px !important;
          align-items: start !important;
        }
        .sw-hud {
          font-size: 10px !important;
        }
        .sw-hud-left {
          grid-area: left;
          width: min(100%, 190px);
          max-height: calc(100dvh - var(--sw-mobile-control-height) - 94px);
          overflow-y: auto;
          overflow-x: hidden;
          overscroll-behavior: contain;
          gap: 4px !important;
          scrollbar-width: thin;
        }
        .sw-hud-panel {
          padding: 4px 6px !important;
          min-width: 0;
          border-radius: 5px !important;
        }
        .sw-hud-row,
        .sw-hud-fire-summary,
        .sw-hud-weapon-row {
          gap: 5px !important;
        }
        .sw-hud-track {
          height: 3px !important;
          margin-top: 3px !important;
        }
        .sw-hud-timer {
          grid-area: timer;
          min-width: 58px !important;
          padding: 4px 6px !important;
          font-size: 12px !important;
        }
        .sw-hud-segment {
          grid-area: segment;
          justify-self: stretch !important;
          width: auto !important;
        }
        .sw-hud-radar {
          right: max(10px, env(safe-area-inset-right)) !important;
          bottom: calc(var(--sw-mobile-control-height) + 78px) !important;
          width: 92px !important;
          height: 92px !important;
        }
        .sw-hud-mute {
          display: none !important;
        }
        .sw-hud-keys {
          display: none !important;
        }
        /* 火力统计从左上纵队翻到战场下沿，缩成 3×2 的轻量信息条；
           底下再留一整块给摇杆和加速键，信息与手指不重叠。 */
        .sw-hud-firepower {
          position: fixed !important;
          z-index: 13;
          left: max(8px, env(safe-area-inset-left)) !important;
          right: max(8px, env(safe-area-inset-right)) !important;
          bottom: calc(var(--sw-mobile-control-height) + 7px) !important;
          width: auto !important;
          max-height: 62px;
          overflow: hidden;
          box-sizing: border-box;
          display: grid !important;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          align-items: center;
          gap: 3px 7px !important;
          padding: 4px 6px !important;
          font-size: 9px !important;
          background: rgba(5, 7, 13, .82) !important;
        }
        .sw-hud-fire-summary,
        .sw-hud-weapon {
          min-width: 0;
        }
        .sw-hud-weapon-row {
          min-width: 0;
        }
        .sw-hud-weapon-label {
          display: block;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .sw-hud-weapon-cd {
          display: none;
        }
        .sw-hud-weapon-value {
          font-size: 8px;
        }
        .sw-hud-fire-track {
          height: 2px !important;
          margin-top: 1px !important;
        }
        .sw-hud-elite,
        .sw-hud-boss {
          width: min(88vw, 420px) !important;
        }
        .sw-hud-elite {
          bottom: calc(var(--sw-mobile-control-height) + 76px) !important;
        }
        .sw-hud-boss {
          bottom: calc(var(--sw-mobile-control-height) + 116px) !important;
        }
        .sw-hud-banner {
          top: max(92px, calc(env(safe-area-inset-top) + 82px)) !important;
          font-size: clamp(18px, 6vw, 28px) !important;
          max-width: 90vw !important;
        }
        .sw-hud-toast {
          left: max(10px, env(safe-area-inset-left)) !important;
          bottom: calc(var(--sw-mobile-control-height) + 76px) !important;
          max-width: min(70vw, 300px);
          white-space: normal !important;
        }
      }

      @media (max-width: 420px) {
        .sw-modal {
          padding-left: 12px !important;
          padding-right: 12px !important;
        }
        .sw-hud-left {
          width: min(100%, 172px);
        }
        .sw-ship-ring {
          transform: scale(.62) !important;
          margin: -88px 0 !important;
        }
      }

      @media (max-height: 560px) and (max-width: 900px),
        (max-height: 560px) and (hover: none) and (pointer: coarse) {
        .sw-hud-left {
          max-height: calc(100dvh - var(--sw-mobile-control-height) - 72px);
        }
        .sw-hud-radar {
          display: none;
        }
        .sw-hud-firepower {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          max-height: 42px;
        }
        .sw-hud-boss {
          bottom: calc(var(--sw-mobile-control-height) + 86px) !important;
        }
        .sw-hud-elite {
          bottom: calc(var(--sw-mobile-control-height) + 52px) !important;
        }
      }

      @media (max-width: 900px), (hover: none) and (pointer: coarse) {
        html.sw-mobile-run {
          --sw-mobile-control-height: calc(clamp(118px, 22dvh, 172px) + env(safe-area-inset-bottom));
        }
        .sw-mobile-controls.sw-mobile-controls-visible {
          position: fixed;
          z-index: 12;
          left: 0;
          right: 0;
          bottom: 0;
          height: var(--sw-mobile-control-height);
          box-sizing: border-box;
          display: grid;
          grid-template-columns: 1fr 1fr;
          align-items: center;
          padding: 8px max(14px, env(safe-area-inset-right))
            max(8px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
          border-top: 1px solid rgba(74, 118, 157, .62);
          background:
            radial-gradient(circle at 18% 52%, rgba(50, 100, 136, .18), transparent 28%),
            radial-gradient(circle at 82% 52%, rgba(90, 190, 146, .12), transparent 25%),
            linear-gradient(180deg, rgba(7, 12, 21, .96), rgba(4, 8, 15, .99));
          box-shadow: 0 -14px 34px rgba(0, 0, 0, .34);
          pointer-events: none !important;
          user-select: none;
          -webkit-user-select: none;
        }
        .sw-mobile-steer,
        .sw-mobile-boost-wrap {
          grid-row: 1;
          min-width: 0;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 3px;
          pointer-events: none;
        }
        .sw-mobile-steer {
          grid-column: 1;
          justify-self: start;
          width: min(44vw, 170px);
        }
        .sw-mobile-boost-wrap {
          grid-column: 2;
          justify-self: end;
          width: min(34vw, 130px);
        }
        .sw-mobile-controls-swapped .sw-mobile-steer {
          grid-column: 2;
          justify-self: end;
        }
        .sw-mobile-controls-swapped .sw-mobile-boost-wrap {
          grid-column: 1;
          justify-self: start;
        }
        .sw-mobile-control-label {
          color: #627f9d;
          font: 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
          letter-spacing: .16em;
          pointer-events: none;
        }
        .sw-mobile-stick-pad {
          position: relative;
          width: clamp(96px, 28vw, 124px);
          height: clamp(96px, 28vw, 124px);
          border: 1px solid rgba(82, 133, 174, .62);
          border-radius: 50%;
          box-sizing: border-box;
          background:
            radial-gradient(circle, rgba(25, 48, 70, .66) 0 28%, rgba(13, 27, 42, .7) 29% 58%, rgba(7, 14, 24, .78) 59%);
          box-shadow: inset 0 0 0 8px rgba(45, 80, 108, .08), 0 5px 18px rgba(0, 0, 0, .3);
          touch-action: none;
          pointer-events: auto;
        }
        .sw-mobile-stick-guides {
          position: absolute;
          inset: 15%;
          border-radius: 50%;
          opacity: .55;
          background:
            linear-gradient(90deg, transparent calc(50% - .5px), #33516d 50%, transparent calc(50% + .5px)),
            linear-gradient(transparent calc(50% - .5px), #33516d 50%, transparent calc(50% + .5px));
          pointer-events: none;
        }
        .sw-mobile-stick-knob {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 42%;
          height: 42%;
          margin: -21% 0 0 -21%;
          border: 1px solid #78b8df;
          border-radius: 50%;
          box-sizing: border-box;
          background: radial-gradient(circle at 38% 34%, #9bd7f5, #477ea2 42%, #1b3a55 100%);
          box-shadow: 0 0 18px rgba(103, 183, 230, .22), inset 0 0 10px rgba(220, 244, 255, .2);
          transition: transform 55ms linear, filter 100ms ease;
          pointer-events: none;
          will-change: transform;
        }
        .sw-mobile-stick-pad.is-active .sw-mobile-stick-knob {
          filter: brightness(1.22);
          transition: none;
        }
        .sw-mobile-boost {
          position: relative;
          width: clamp(70px, 20vw, 86px);
          height: clamp(70px, 20vw, 86px);
          padding: 0;
          border: 1px solid rgba(115, 227, 177, .78);
          border-radius: 50%;
          box-sizing: border-box;
          color: #dffff0;
          background: radial-gradient(circle at 40% 35%, #5dbb91, #25684d 48%, #102c24 100%);
          box-shadow: 0 0 20px rgba(91, 230, 164, .18), inset 0 0 0 7px rgba(183, 255, 220, .06);
          touch-action: none;
          pointer-events: auto;
          -webkit-appearance: none;
        }
        .sw-mobile-boost::after {
          content: '';
          position: absolute;
          inset: 8px;
          border: 1px solid rgba(207, 255, 232, .22);
          border-radius: 50%;
        }
        .sw-mobile-boost-core {
          display: block;
          transform: translateX(1px) rotate(-8deg);
          font: 700 clamp(26px, 8vw, 34px)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
          letter-spacing: -.22em;
          text-shadow: 0 0 10px rgba(223, 255, 240, .46);
          pointer-events: none;
        }
        .sw-mobile-boost.is-active {
          transform: scale(.94);
          filter: brightness(1.35);
          box-shadow: 0 0 30px rgba(91, 230, 164, .44), inset 0 0 0 8px rgba(223, 255, 240, .1);
        }
      }

      /* 横屏手机的底带只有约 118px：控件按高度再收一档，避免圆盘伸出视口。 */
      @media (max-height: 560px) and (max-width: 900px),
        (max-height: 560px) and (hover: none) and (pointer: coarse) {
        .sw-mobile-controls.sw-mobile-controls-visible {
          padding-top: 4px;
          padding-bottom: max(4px, env(safe-area-inset-bottom));
        }
        .sw-mobile-stick-pad {
          width: 90px;
          height: 90px;
        }
        .sw-mobile-boost {
          width: 74px;
          height: 74px;
        }
        .sw-mobile-control-label {
          font-size: 8px;
        }
        .sw-mobile-boost-core {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div id="boot-title">STARWRECK</div>
      <div id="boot-track"><div id="boot-fill"></div></div>
    </div>
    <div id="game"></div>
    <div id="ui"></div>
    <script>
      // 内联、无依赖:主包下载期间 bar 自己慢慢爬(对数式,爬到 92% 就越来越慢,
      // 永远不顶满 —— 顶满只由 main.ts 的 bootLoadingDone 说了算),main.ts 的
      // 里程碑(包下完 / i18n 就位 / 渲染层建好)随时可以把它往上顶。
      (function () {
        var fill = document.getElementById('boot-fill');
        var overlay = document.getElementById('boot');
        var target = 0;
        var shown = 0;
        var done = false;
        var removed = false;
        var creep = setInterval(function () {
          if (!done) target = Math.min(92, target + (92 - target) * 0.03 + 0.3);
        }, 300);
        function tick() {
          if (removed) return;
          shown += (target - shown) * 0.12;
          if (target - shown < 0.4) shown = target;
          fill.style.width = shown + '%';
          if (done && shown >= 99.5) {
            removed = true;
            clearInterval(creep);
            overlay.classList.add('boot-done');
            setTimeout(function () {
              overlay.remove();
            }, 600);
            return;
          }
          requestAnimationFrame(tick);
        }
        window.__bootLoading = {
          set: function (p) {
            if (p > target) target = Math.min(p, 100);
          },
          done: function () {
            done = true;
            target = 100;
          },
        };
        requestAnimationFrame(tick);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
